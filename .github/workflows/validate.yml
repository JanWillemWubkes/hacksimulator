name: Validatie

# Waarom deze workflow bestaat (Sessie 208):
# Alle kwaliteitsgates draaiden tot nu toe uitsluitend als lokale pre-commit hook.
# Een commit met --no-verify, een push vanaf een andere machine of een wijziging via
# de GitHub-webinterface omzeilde ze volledig — precies de gaten waardoor de drift
# ontstond die Check 6d en 9c/9d nu vangen. Dit haalt de gates van één machine af.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

# Zonder dit blok erft GITHUB_TOKEN de repo-default, die read-write kan zijn.
# Deze workflow leest alleen de checkout en schrijft nergens naartoe, dus het
# minimum volstaat. Expliciet neerzetten scheelt afhankelijkheid van een
# repo-instelling die je niet in de diff ziet veranderen.
permissions:
  contents: read

jobs:
  validate:
    name: Documentatie- en blogvalidatie
    runs-on: ubuntu-latest

    steps:
      # v4 draaide op Node 20 en werd door de runner al geforceerd naar Node 24 — dat
      # leverde elke run een deprecation-annotatie op naast het echte resultaat, wat
      # de signaalwaarde van de annotatielijst verlaagt. v7 is de laatste major; zijn
      # breaking change (fork-PR-checkout blokkeren) raakt alleen `pull_request_target`
      # en `workflow_run`, en die triggers gebruikt deze workflow niet.
      - uses: actions/checkout@v7

      # gitleaks draaide tot Sessie 231 uitsluitend als pre-commit hook, en dan nog
      # alleen over de *staged* bestanden. Een --no-verify, een push vanaf een andere
      # machine of een web-edit omzeilde de secret-scan dus volledig - hetzelfde gat
      # dat de comment bovenaan voor de andere gates beschrijft.
      #
      # --no-git scant de werkboom in plaats van de historie; dat werkt met de shallow
      # checkout hierboven. Versie gepind op dezelfde major als .pre-commit-config.yaml,
      # zodat lokaal en CI hetzelfde meten.
      #
      # `gitleaks version` staat er bewust vóór: als de download stilletjes mislukt,
      # faalt die regel zichtbaar in plaats van dat een lege scan groen oogt.
      - name: Secret-scan (gitleaks)
        run: |
          VERSIE=8.21.2
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSIE}/gitleaks_${VERSIE}_linux_x64.tar.gz" \
            | tar -xz -C /tmp gitleaks
          /tmp/gitleaks version
          /tmp/gitleaks detect --no-git --source . --config .gitleaks.toml --redact --verbose

      - name: Blogstructuur (JSON-LD, breadcrumbs, tag-balans, verificatiedatum)
        run: ./scripts/validate-blogs.sh

      # --deep bevat de drift-checks die alleen zin hebben op een volledige checkout:
      # bundle-KB, milestone-tellingen, content-floors, RSS-titel-lockstep, blogvolgorde.
      - name: Cross-doc-invarianten en content-drift
        run: ./scripts/validate-docs.sh --deep

      - name: Reviewpakket is reproduceerbaar uit de bron
        run: |
          node scripts/build-review-package.mjs --out /tmp/review-check.md
          test -s /tmp/review-check.md
