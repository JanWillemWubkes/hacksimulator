# Netlify configuration for HackSimulator.nl
# Documentation: https://docs.netlify.com/configure-builds/file-based-configuration/

[build]
  # Publish directory (root of repo for vanilla JS)
  publish = "."

  # No build command needed (vanilla JS, no bundler)
  command = "echo 'No build step required for vanilla JS'"

# Asset optimization (Sessie 100 — Bundle Size Optimalisatie)
# Netlify minifies on deploy; source files stay readable in repo
[build.processing.css]
  bundle = false
  minify = true
[build.processing.js]
  bundle = false
  minify = true
[build.processing.html]
  pretty_urls = false
  minify = true
[build.processing.images]
  compress = true

# Cache busting settings
[build.environment]
  NODE_VERSION = "18"

# Redirects (SPA fallback - disabled for now, not needed for vanilla JS)
# [[redirects]]
#   from = "/*"
#   to = "/index.html"
#   status = 200

# Custom Domain Redirects (Activate when hacksimulator.nl is live)
# Uncomment these redirects after domain is configured in Netlify

# Redirect www to apex domain
[[redirects]]
  from = "https://www.hacksimulator.nl/*"
  to = "https://hacksimulator.nl/:splat"
  status = 301
  force = true

# Force HTTPS
# [[redirects]]
#   from = "http://hacksimulator.nl/*"
#   to = "https://hacksimulator.nl/:splat"
#   status = 301
#   force = true

# [[redirects]]
#   from = "http://www.hacksimulator.nl/*"
#   to = "https://hacksimulator.nl/:splat"
#   status = 301
#   force = true

# Optional: Redirect old Netlify subdomain to custom domain
[[redirects]]
  from = "https://famous-frangollo-b5a758.netlify.app/*"
  to = "https://hacksimulator.nl/:splat"
  status = 301
  force = true

# Legal pages canonicalisation — mail-templates en oudere referenties
# wijzen vaak naar /privacy.html etc. terwijl de echte locatie /assets/legal/ is.
# 301 redirects zorgen dat /privacy.html /terms.html /cookies.html allemaal
# het juiste document serveren zonder dat elk bronbestand bijgewerkt hoeft.
[[redirects]]
  from = "/privacy.html"
  to = "/assets/legal/privacy.html"
  status = 301
  force = true

[[redirects]]
  from = "/terms.html"
  to = "/assets/legal/terms.html"
  status = 301
  force = true

[[redirects]]
  from = "/cookies.html"
  to = "/assets/legal/cookies.html"
  status = 301
  force = true

# security.txt: legacy locatie /security.txt → canonieke /.well-known/security.txt (RFC 9116)
[[redirects]]
  from = "/security.txt"
  to = "/.well-known/security.txt"
  status = 301
  force = true

# =============================================================================
# Interne paden afschermen (Sessie 231)
#
# `publish = "."` hierboven serveert de HELE repo-root op de CDN. Er is geen
# build-stap die een schone dist/ oplevert, dus alles wat in git zit stond live.
# Gemeten op productie vóór deze fix, allemaal HTTP 200:
#   /docs/products/*.typ          de volledige bron van de 4 BETAALDE Gumroad-gidsen
#   /docs/sessions/archive-*.md   sessielogs incl. het privé-mailadres van de eigenaar
#   /TASKS.md /PLANNING.md        326 KB interne planning
#   /scripts/*.sh /package.json   buildscripts en dependency-manifest
#
# robots.txt had `Disallow: /docs/`, maar dat is indexeringsadvies — geen
# toegangscontrole. Het wees juist de weg naar de mappen die verborgen moesten
# blijven. Dit blok is de echte poort; robots.txt noemt ze daarom niet meer.
#
# Geverifieerd vóór invoering: geen enkele publieke href/src in HTML/XML/txt
# wijst naar /docs/, /scripts/ of /tests/, en llms.txt noemt ze niet.
# SECURITY.md blijft bewust bereikbaar (responsible disclosure, RFC 9116).
#
# Nieuwe interne map of root-doc erbij? Dan hier een regel bijzetten — Check 19
# in scripts/validate-docs.sh faalt als je dat vergeet.
# =============================================================================
[[redirects]]
  from = "/docs/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/scripts/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/tests/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/TASKS.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/PLANNING.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/SESSIONS.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/package.json"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/playwright.config.js"
  to = "/404.html"
  status = 404
  force = true

# Security Headers
[[headers]]
  for = "/*"
  [headers.values]
    # Prevent clickjacking
    X-Frame-Options = "SAMEORIGIN"

    # Prevent MIME sniffing
    X-Content-Type-Options = "nosniff"

    # XSS Protection: explicitly disabled (OWASP guidance).
    # De legacy XSS-auditor introduceerde zelf kwetsbaarheden in oude browsers
    # en wordt door moderne browsers genegeerd; "0" is de aanbevolen waarde.
    # Echte XSS-bescherming komt van output-escaping (src/ui/renderer.js) + CSP.
    X-XSS-Protection = "0"

    # Referrer Policy
    Referrer-Policy = "strict-origin-when-cross-origin"

    # Cross-Origin-Opener-Policy (M5 Best Practices: Isolate browsing context)
    Cross-Origin-Opener-Policy = "same-origin"

    # Content Security Policy (M5 Performance: Moved from HTML meta tag for faster parsing)
    # script-src: GEEN 'unsafe-inline'/'unsafe-hashes' — alle inline scripts zijn
    #   geëxternaliseerd naar /src/*.js (consent-default.js, brevo-config.js,
    #   init-theme.js, load-animations-css.js), gedekt door 'self'.
    # font-src: 'self' data: for base64 inline fonts, fonts.gstatic.com for Google Fonts
    # style-src: fonts.googleapis.com for Google Fonts CSS (Sessie 95: Font loading fix)
    # connect-src allows Google Analytics API calls (Sessie 91: GA4 integration)
    # CSP strengthened in Sessie 96 - Security Review: Added object-src, base-uri, form-action
    # Sessie 126: Brevo newsletter (sibforms.com) added to script-src, style-src, connect-src, form-action; MailerLite removed
    # Sessie 208: AdSense volledig verwijderd → alle ad-domeinen uit script-src/img-src/connect-src
    #   en frame-src naar 'none' (alleen ad-iframes gebruikten frame-src).
    # Sessie 231: sibforms.com UIT script-src. Brevo's main.js (450 KB) is verwijderd:
    #   brevo-submit.js onderschept het submit-event met stopImmediatePropagation() en
    #   doet de POST zelf, dus die bundel deed niets meer. Ablatie-meting: de nieuwsbrief-
    #   kaart rendert byte-identiek zonder (zelfde MD5 op de screenshot), en native
    #   type=email + required dekt de validatie. Daarmee vervalt ook het SRI-gat: er is
    #   geen extern script meer om te pinnen.
    #   sibforms.com blijft in style-src (sib-styles.css draagt wél layout — zonder die
    #   stylesheet verschuift de kaart 74px), in connect-src (de fetch-POST) en in
    #   form-action (native fallback als brevo-submit.js niet laadt).
    # Sessie 231: frame-ancestors 'self' toegevoegd — de moderne tegenhanger van
    #   X-Frame-Options, die bij conflict wint en door meer browsers wordt gehonoreerd.
    # Sessie 231: fonts.googleapis.com/gstatic.com verwijderd — de fonts staan sinds
    #   Sessie 95 self-hosted in /styles/fonts/, de allowlist was dode ruimte.
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline' https://sibforms.com; font-src 'self' data:; img-src 'self' data:; frame-src 'none'; frame-ancestors 'self'; connect-src 'self' https://www.google-analytics.com https://*.google-analytics.com https://sibforms.com https://*.sibforms.com; object-src 'none'; base-uri 'self'; form-action 'self' https://sibforms.com https://*.sibforms.com;"

# Strict Transport Security (Upgraded Sessie 97 - Security Headers B → A)
# 1-year max-age: browser remembers HTTPS-only for 12 months
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

# Permissions Policy (Sessie 97 - Security Headers B → A)
# Restrict browser features not needed by the application
[[headers]]
  for = "/*"
  [headers.values]
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=()"

# Font Caching (Sessie 81 - Android Chrome ASCII Box Rendering Fix)
# Aggressive caching for font subset (immutable after deploy)
[[headers]]
  for = "/styles/fonts/*"
  [headers.values]
    # 1-year cache (font never changes after deploy)
    Cache-Control = "public, max-age=31536000, immutable"
    # CORS headers for cross-origin font loading
    Access-Control-Allow-Origin = "*"
